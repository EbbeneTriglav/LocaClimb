name: OSM expand (per country)

# Builds passes for one region at a time with the SAME heuristic, into a dedicated
# osm_passes_<country>.json. Run one target per dispatch (avoids concurrent commit clashes).
# The frontend merges every file listed in osm_regions.json.
#
# 2026-08: estensione a Francia, Spagna, Portogallo, Germania e Balcani.
# Struttura invariata (era gia' collaudata): si aggiungono solo voci al case,
# il ritaglio bbox opzionale per la Spagna (estratto unico da 1,2 GB) e tre passi
# non distruttivi in coda (riepilogo, manifest, riquadri).
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Region to build"
        required: true
        type: choice
        options:
          # --- collaudati ---
          - italy-sud
          - france-alps
          - switzerland
          - austria
          # --- Francia (per regione) ---
          - france-rhone-alpes
          - france-paca
          - france-midi-pyrenees
          - france-auvergne
          - france-languedoc
          - france-corse
          - france-aquitaine
          - france-jura
          - france-est
          - france-centro-ovest
          - france-nord
          - france-bretagne-idf
          # --- Spagna (fette che insieme coprono tutto il paese) ---
          - spain-nord
          - spain-centro
          - spain-sud
          - spain-baleari
          - spain-canarie
          # --- Portogallo ---
          - portugal
          # --- Germania (per Land) ---
          - germany-bayern
          - germany-baden-wuerttemberg
          - germany-ovest
          - germany-nrw
          - germany-est
          - germany-nord
          - germany-nordest
          # --- Balcani ---
          - slovenia
          - croatia
          - romania
          - bosnia
          - montenegro-albania-macedonia
          - serbia
          - bulgaria
          # --- Europa centrale e del nord ---
          - belgium
          - netherlands-luxembourg
          - czech-republic
          - poland
          - hungary
          - greece
          # --- Isole britanniche, Nord Africa, Anatolia ---
          - scotland
          - wales
          - england-nord
          - england-sud-ovest
          - england-sud-est
          - ireland
          - morocco
          - turkey-ovest
          - turkey-est
          # --- Nord Europa e Baltici ---
          - norway
          - sweden
          - finland
          - estonia
          - latvia
          - lithuania
          - slovakia
          # --- VALICHI DI CONFINE: due paesi in un solo grafo, entrambi i versanti ---
          - confine-it-ch
          - confine-it-at
          - confine-it-fr
          - confine-it-si
          - confine-fr-es
          - confine-fr-ch
          - confine-fr-de
          - confine-de-at
          - confine-de-ch
          - confine-at-si
          - confine-si-hr
          - confine-hr-ba
          - confine-ba-me-rs
          - confine-me-al
          - confine-es-pt
          - confine-ro-rs
      dry_run:
        description: "Solo verifica: risolve il target e si ferma"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: osm-data          # condiviso con osm-refresh e osm-border: serializza chi scrive i manifesti
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y osmium-tool
          npm install pngjs --no-save

      - name: Resolve target -> PBF list + output
        id: cfg
        run: |
          GF=https://download.geofabrik.de/europe
          case "${{ github.event.inputs.target }}" in
            # ---------- collaudati ----------
            italy-sud)
              echo "pbf=$GF/italy/sud-latest.osm.pbf,$GF/italy/isole-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_sud.json' >> "$GITHUB_OUTPUT" ;;
            france-alps)
              echo "pbf=$GF/france/rhone-alpes-latest.osm.pbf,$GF/france/provence-alpes-cote-d-azur-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_fr.json' >> "$GITHUB_OUTPUT" ;;
            switzerland)
              echo "pbf=$GF/switzerland-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_ch.json' >> "$GITHUB_OUTPUT" ;;
            austria)
              echo "pbf=$GF/austria-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_at.json' >> "$GITHUB_OUTPUT" ;;

            # ---------- Francia ----------
            france-rhone-alpes)   # Galibier, Croix de Fer, Madeleine, Iseran
              echo "pbf=$GF/france/rhone-alpes-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_fr_ra.json' >> "$GITHUB_OUTPUT" ;;
            france-paca)          # Izoard, Vars, Allos, Bonette, Ventoux
              echo "pbf=$GF/france/provence-alpes-cote-d-azur-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_fr_paca.json' >> "$GITHUB_OUTPUT" ;;
            france-midi-pyrenees) # Tourmalet, Aspin, Peyresourde
              echo "pbf=$GF/france/midi-pyrenees-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_fr_mp.json' >> "$GITHUB_OUTPUT" ;;
            france-auvergne)      # Massiccio Centrale
              echo "pbf=$GF/france/auvergne-latest.osm.pbf,$GF/france/limousin-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_fr_auv.json' >> "$GITHUB_OUTPUT" ;;
            france-languedoc)     # Mont Lozere, Aigoual, Pirenei orientali
              echo "pbf=$GF/france/languedoc-roussillon-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_fr_lr.json' >> "$GITHUB_OUTPUT" ;;
            france-corse)         # Bavella, Vergio, Vizzavona
              echo "pbf=$GF/france/corse-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_fr_corse.json' >> "$GITHUB_OUTPUT" ;;
            france-aquitaine)     # Pirenei atlantici, Marie-Blanque
              echo "pbf=$GF/france/aquitaine-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_fr_aq.json' >> "$GITHUB_OUTPUT" ;;
            france-jura)          # Giura, Faucille
              echo "pbf=$GF/france/franche-comte-latest.osm.pbf,$GF/france/bourgogne-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_fr_fcb.json' >> "$GITHUB_OUTPUT" ;;
            france-est)           # Vosgi, Grand Ballon, Planche des Belles Filles
              echo "pbf=$GF/france/alsace-latest.osm.pbf,$GF/france/lorraine-latest.osm.pbf,$GF/france/champagne-ardenne-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_fr_est.json' >> "$GITHUB_OUTPUT" ;;
            france-centro-ovest)
              echo "pbf=$GF/france/centre-latest.osm.pbf,$GF/france/poitou-charentes-latest.osm.pbf,$GF/france/pays-de-la-loire-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_fr_co.json' >> "$GITHUB_OUTPUT" ;;
            france-nord)
              echo "pbf=$GF/france/nord-pas-de-calais-latest.osm.pbf,$GF/france/picardie-latest.osm.pbf,$GF/france/haute-normandie-latest.osm.pbf,$GF/france/basse-normandie-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_fr_nord.json' >> "$GITHUB_OUTPUT" ;;
            france-bretagne-idf)
              echo "pbf=$GF/france/bretagne-latest.osm.pbf,$GF/france/ile-de-france-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_fr_bidf.json' >> "$GITHUB_OUTPUT" ;;

            # ---------- Spagna: estratto unico, tagliato in fette ----------
            spain-nord)           # Angliru, Picos, Pirenei, Catalogna nord
              echo "pbf=$GF/spain-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=-9.6,41.4,3.5,44.0' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_es_n.json' >> "$GITHUB_OUTPUT" ;;
            spain-centro)         # Navacerrada, Gredos, Aragona, Valencia
              echo "pbf=$GF/spain-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=-9.6,38.4,3.5,41.5' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_es_c.json' >> "$GITHUB_OUTPUT" ;;
            spain-sud)            # Sierra Nevada, Ronda, Murcia
              echo "pbf=$GF/spain-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=-7.7,35.8,0.9,38.5' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_es_s.json' >> "$GITHUB_OUTPUT" ;;
            spain-baleari)        # Sa Calobra, Puig Major
              echo "pbf=$GF/spain-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=1.1,38.6,4.4,40.2' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_es_bal.json' >> "$GITHUB_OUTPUT" ;;
            spain-canarie)        # Teide, Masca - estratto AFRICA (Geofabrik divide per geografia,
                                  # le Canarie NON sono in europe/spain): niente bbox, il file e' gia' solo isole
              echo "pbf=https://download.geofabrik.de/africa/canary-islands-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_es_can.json' >> "$GITHUB_OUTPUT" ;;

            # ---------- Portogallo (isole comprese) ----------
            portugal)
              echo "pbf=$GF/portugal-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_pt.json' >> "$GITHUB_OUTPUT" ;;

            # ---------- Germania ----------
            germany-bayern)       # Rossfeld, Kesselberg, Riedbergpass
              echo "pbf=$GF/germany/bayern-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_de_by.json' >> "$GITHUB_OUTPUT" ;;
            germany-baden-wuerttemberg)  # Foresta Nera, Feldberg
              echo "pbf=$GF/germany/baden-wuerttemberg-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_de_bw.json' >> "$GITHUB_OUTPUT" ;;
            germany-ovest)        # Assia, Renania-Palatinato, Saarland
              echo "pbf=$GF/germany/hessen-latest.osm.pbf,$GF/germany/rheinland-pfalz-latest.osm.pbf,$GF/germany/saarland-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_de_w.json' >> "$GITHUB_OUTPUT" ;;
            germany-nrw)          # Eifel, Sauerland
              echo "pbf=$GF/germany/nordrhein-westfalen-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_de_nrw.json' >> "$GITHUB_OUTPUT" ;;
            germany-est)          # Turingia, Sassonia, Erzgebirge
              echo "pbf=$GF/germany/thueringen-latest.osm.pbf,$GF/germany/sachsen-latest.osm.pbf,$GF/germany/sachsen-anhalt-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_de_e.json' >> "$GITHUB_OUTPUT" ;;
            germany-nord)         # Harz
              echo "pbf=$GF/germany/niedersachsen-latest.osm.pbf,$GF/germany/bremen-latest.osm.pbf,$GF/germany/hamburg-latest.osm.pbf,$GF/germany/schleswig-holstein-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_de_n.json' >> "$GITHUB_OUTPUT" ;;
            germany-nordest)
              echo "pbf=$GF/germany/brandenburg-latest.osm.pbf,$GF/germany/berlin-latest.osm.pbf,$GF/germany/mecklenburg-vorpommern-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_de_ne.json' >> "$GITHUB_OUTPUT" ;;

            # ---------- Balcani ----------
            slovenia)             # Vrsic, Mangart, Sorica
              echo "pbf=$GF/slovenia-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_si.json' >> "$GITHUB_OUTPUT" ;;
            croatia)              # Ucka, Biokovo, Velebit
              echo "pbf=$GF/croatia-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_hr.json' >> "$GITHUB_OUTPUT" ;;
            romania)              # Transfagarasan, Transalpina
              echo "pbf=$GF/romania-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_ro.json' >> "$GITHUB_OUTPUT" ;;
            bosnia)
              echo "pbf=$GF/bosnia-herzegovina-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_ba.json' >> "$GITHUB_OUTPUT" ;;
            montenegro-albania-macedonia)   # Kotor, Durmitor, Llogara
              echo "pbf=$GF/montenegro-latest.osm.pbf,$GF/albania-latest.osm.pbf,$GF/macedonia-latest.osm.pbf,$GF/kosovo-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_bal_s.json' >> "$GITHUB_OUTPUT" ;;
            serbia)
              echo "pbf=$GF/serbia-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_rs.json' >> "$GITHUB_OUTPUT" ;;
            bulgaria)             # Shipka, Rila, Rodopi
              echo "pbf=$GF/bulgaria-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_bg.json' >> "$GITHUB_OUTPUT" ;;

            # ---------- Europa centrale e del nord ----------
            belgium)              # Ardenne: Mur de Huy, La Redoute, Muur
              echo "pbf=$GF/belgium-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_be.json' >> "$GITHUB_OUTPUT" ;;
            netherlands-luxembourg)   # Limburgo (Cauberg) + Ardenne lussemburghesi
              echo "pbf=$GF/netherlands-latest.osm.pbf,$GF/luxembourg-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_nl_lu.json' >> "$GITHUB_OUTPUT" ;;
            czech-republic)       # Krkonose, Jeseniky
              echo "pbf=$GF/czech-republic-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_cz.json' >> "$GITHUB_OUTPUT" ;;
            poland)               # Tatra, Karkonosze, Bieszczady (estratto grande)
              echo "pbf=$GF/poland-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_pl.json' >> "$GITHUB_OUTPUT" ;;
            hungary)              # Dobogoko, Mecsek, Bukk
              echo "pbf=$GF/hungary-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_hu.json' >> "$GITHUB_OUTPUT" ;;
            greece)               # Olimpo, Parnaso, Peloponneso (estratto grande)
              echo "pbf=$GF/greece-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_gr.json' >> "$GITHUB_OUTPUT" ;;
            scotland)             # Highlands: Bealach na Ba, Applecross
              echo "pbf=$GF/united-kingdom/scotland-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_gb_sco.json' >> "$GITHUB_OUTPUT" ;;
            wales)                # Snowdonia, Brecon, Bwlch
              echo "pbf=$GF/united-kingdom/wales-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_gb_wal.json' >> "$GITHUB_OUTPUT" ;;
            england-nord)         # Lake District, Peak, Yorkshire, Pennini (contee)
              echo "pbf=$GF/united-kingdom/england/cumbria-latest.osm.pbf,$GF/united-kingdom/england/north-yorkshire-latest.osm.pbf,$GF/united-kingdom/england/west-yorkshire-latest.osm.pbf,$GF/united-kingdom/england/south-yorkshire-latest.osm.pbf,$GF/united-kingdom/england/lancashire-latest.osm.pbf,$GF/united-kingdom/england/durham-latest.osm.pbf,$GF/united-kingdom/england/northumberland-latest.osm.pbf,$GF/united-kingdom/england/derbyshire-latest.osm.pbf,$GF/united-kingdom/england/cheshire-latest.osm.pbf,$GF/united-kingdom/england/staffordshire-latest.osm.pbf,$GF/united-kingdom/england/greater-manchester-latest.osm.pbf,$GF/united-kingdom/england/shropshire-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_gb_en_n.json' >> "$GITHUB_OUTPUT" ;;
            england-sud-ovest)    # Dartmoor/Exmoor/Cornovaglia/Cotswolds/Mendip
              echo "pbf=$GF/united-kingdom/england/cornwall-latest.osm.pbf,$GF/united-kingdom/england/devon-latest.osm.pbf,$GF/united-kingdom/england/somerset-latest.osm.pbf,$GF/united-kingdom/england/dorset-latest.osm.pbf,$GF/united-kingdom/england/bristol-latest.osm.pbf,$GF/united-kingdom/england/gloucestershire-latest.osm.pbf,$GF/united-kingdom/england/wiltshire-latest.osm.pbf,$GF/united-kingdom/england/herefordshire-latest.osm.pbf,$GF/united-kingdom/england/worcestershire-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_gb_en_so.json' >> "$GITHUB_OUTPUT" ;;
            england-sud-est)      # North/South Downs, Chilterns (Box Hill, Ditchling)
              echo "pbf=$GF/united-kingdom/england/surrey-latest.osm.pbf,$GF/united-kingdom/england/kent-latest.osm.pbf,$GF/united-kingdom/england/east-sussex-latest.osm.pbf,$GF/united-kingdom/england/west-sussex-latest.osm.pbf,$GF/united-kingdom/england/hampshire-latest.osm.pbf,$GF/united-kingdom/england/isle-of-wight-latest.osm.pbf,$GF/united-kingdom/england/oxfordshire-latest.osm.pbf,$GF/united-kingdom/england/buckinghamshire-latest.osm.pbf,$GF/united-kingdom/england/berkshire-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_gb_en_se.json' >> "$GITHUB_OUTPUT" ;;
            ireland)              # Irlanda + Nord Irlanda (Wicklow, Kerry, Conor Pass)
              echo "pbf=$GF/ireland-and-northern-ireland-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_ie.json' >> "$GITHUB_OUTPUT" ;;
            morocco)              # Alto Atlante: Tizi n'Tichka, Tizi n'Test (estratto AFRICA)
              echo "pbf=https://download.geofabrik.de/africa/morocco-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_ma.json' >> "$GITHUB_OUTPUT" ;;
            turkey-ovest)         # Anatolia ovest, Egeo, Tauro occidentale
              echo "pbf=$GF/turkey-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=25.5,35.5,34.5,42.5' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_tr_w.json' >> "$GITHUB_OUTPUT" ;;
            turkey-est)           # Anatolia centro-est, Tauro orientale
              echo "pbf=$GF/turkey-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=33.5,35.5,45.5,42.5' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_tr_e.json' >> "$GITHUB_OUTPUT" ;;
            norway)               # fiordi: salite dal mare, Trollstigen, Sognefjellet
              echo "pbf=$GF/norway-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_no.json' >> "$GITHUB_OUTPUT" ;;
            sweden)
              echo "pbf=$GF/sweden-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_se.json' >> "$GITHUB_OUTPUT" ;;
            finland)
              echo "pbf=$GF/finland-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_fi.json' >> "$GITHUB_OUTPUT" ;;
            estonia)
              echo "pbf=$GF/estonia-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_ee.json' >> "$GITHUB_OUTPUT" ;;
            latvia)
              echo "pbf=$GF/latvia-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_lv.json' >> "$GITHUB_OUTPUT" ;;
            lithuania)
              echo "pbf=$GF/lithuania-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_lt.json' >> "$GITHUB_OUTPUT" ;;
            slovakia)             # Alti/Bassi Tatra, Fatra
              echo "pbf=$GF/slovakia-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_sk.json' >> "$GITHUB_OUTPUT" ;;
            # ---------- VALICHI DI CONFINE ----------
            # Si caricano i due paesi confinanti e si ritaglia la fascia di frontiera:
            # cosi' il grafo stradale contiene ENTRAMBI i versanti e la salita non viene
            # scartata perche' la meta' in-paese e' troppo corta (>=1,5 km / >=200 m).
            confine-it-ch)        # Spluga, San Bernardino, Maloja, Bernina, Sempione, Umbrail
              echo "pbf=$GF/italy/nord-ovest-latest.osm.pbf,$GF/italy/nord-est-latest.osm.pbf,$GF/switzerland-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=7.0,45.8,10.6,46.8' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_ch.json' >> "$GITHUB_OUTPUT" ;;
            confine-it-at)        # Rombo/Timmelsjoch, Resia, Brennero, Vizze, Stalle, Croce Comelico
              echo "pbf=$GF/italy/nord-est-latest.osm.pbf,$GF/austria-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=10.3,46.4,13.5,47.15' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_at.json' >> "$GITHUB_OUTPUT" ;;
            confine-it-fr)        # Monginevro, Moncenisio, Maddalena, Agnello, Lombarda, Tenda
              echo "pbf=$GF/italy/nord-ovest-latest.osm.pbf,$GF/france/rhone-alpes-latest.osm.pbf,$GF/france/provence-alpes-cote-d-azur-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=6.0,44.0,7.8,45.4' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_fr.json' >> "$GITHUB_OUTPUT" ;;
            confine-it-si)        # Predil, Vrsic lato italiano, Collio
              echo "pbf=$GF/italy/nord-est-latest.osm.pbf,$GF/slovenia-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=13.2,45.6,14.3,46.6' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_itsi.json' >> "$GITHUB_OUTPUT" ;;
            confine-fr-es)        # Pirenei: Portalet, Somport, Envalira, Ares
              echo "pbf=$GF/france/midi-pyrenees-latest.osm.pbf,$GF/france/aquitaine-latest.osm.pbf,$GF/france/languedoc-roussillon-latest.osm.pbf,$GF/spain-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=-1.9,42.2,3.3,43.4' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_fres.json' >> "$GITHUB_OUTPUT" ;;
            confine-fr-ch)        # Giura e Lemano: Faucille, Marchairuz, Jougne
              echo "pbf=$GF/france/franche-comte-latest.osm.pbf,$GF/france/rhone-alpes-latest.osm.pbf,$GF/switzerland-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=5.8,45.8,7.2,47.6' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_frch.json' >> "$GITHUB_OUTPUT" ;;
            confine-fr-de)        # Vosgi e Foresta Nera lungo il Reno
              echo "pbf=$GF/france/alsace-latest.osm.pbf,$GF/germany/baden-wuerttemberg-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=7.2,47.4,8.6,49.1' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_frde.json' >> "$GITHUB_OUTPUT" ;;
            confine-de-at)        # Alpi bavaresi: Riedberg, Hahntenn, Fern, Achenpass
              echo "pbf=$GF/germany/bayern-latest.osm.pbf,$GF/austria-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=9.9,47.2,13.3,48.0' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_deat.json' >> "$GITHUB_OUTPUT" ;;
            confine-de-ch)        # Foresta Nera meridionale / Sciaffusa
              echo "pbf=$GF/germany/baden-wuerttemberg-latest.osm.pbf,$GF/switzerland-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=7.5,47.3,9.9,48.1' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_dech.json' >> "$GITHUB_OUTPUT" ;;
            confine-at-si)        # Caravanche: Loibl/Ljubelj, Wurzen/Korensko, Seeberg
              echo "pbf=$GF/austria-latest.osm.pbf,$GF/slovenia-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=13.2,46.3,16.3,46.95' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_atsi.json' >> "$GITHUB_OUTPUT" ;;
            confine-si-hr)        # Istria e Gorski Kotar
              echo "pbf=$GF/slovenia-latest.osm.pbf,$GF/croatia-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=13.4,45.2,16.7,46.4' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_sihr.json' >> "$GITHUB_OUTPUT" ;;
            confine-hr-ba)        # Dinariche: Velebit interno, Livno, Grahovo
              echo "pbf=$GF/croatia-latest.osm.pbf,$GF/bosnia-herzegovina-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=15.6,42.5,19.2,45.4' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_hrba.json' >> "$GITHUB_OUTPUT" ;;
            confine-ba-me-rs)     # Durmitor, Tara, Zlatibor
              echo "pbf=$GF/bosnia-herzegovina-latest.osm.pbf,$GF/montenegro-latest.osm.pbf,$GF/serbia-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=17.9,42.2,20.8,44.8' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_bamers.json' >> "$GITHUB_OUTPUT" ;;
            confine-me-al)        # Prokletije, Llogara, Kotor interno
              echo "pbf=$GF/montenegro-latest.osm.pbf,$GF/albania-latest.osm.pbf,$GF/kosovo-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=18.9,41.7,20.8,42.9' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_meal.json' >> "$GITHUB_OUTPUT" ;;
            confine-es-pt)        # Geres/Xures, Sanabria, Serra da Estrela nord
              echo "pbf=$GF/spain-latest.osm.pbf,$GF/portugal-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=-9.0,39.3,-6.1,42.3' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_espt.json' >> "$GITHUB_OUTPUT" ;;
            confine-ro-rs)        # Porte di Ferro / Danubio
              echo "pbf=$GF/romania-latest.osm.pbf,$GF/serbia-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo 'bbox=20.9,44.2,23.2,45.6' >> "$GITHUB_OUTPUT"
              echo 'out=osm_passes_xb_rors.json' >> "$GITHUB_OUTPUT" ;;

            *)
              echo "Target sconosciuto: ${{ github.event.inputs.target }}"; exit 1 ;;
          esac

      - name: Show plan
        run: |
          echo "target : ${{ github.event.inputs.target }}"
          echo "pbf    : ${{ steps.cfg.outputs.pbf }}"
          echo "bbox   : ${{ steps.cfg.outputs.bbox }}"
          echo "out    : ${{ steps.cfg.outputs.out }}"
          df -h / | tail -1

      - name: Build passes for ${{ github.event.inputs.target }}
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          LC_PBF: ${{ steps.cfg.outputs.pbf }}
          ZBBOX: ${{ steps.cfg.outputs.bbox }}
        # --no-curated: i passi curati sono italiani, in un PBF estero non esistono -> 25 righe di
        #   "no road" e un curated_overrides.json a 2 voci. Quel file lo possiede solo osm-refresh.
        # LC_BBOX viene esportato solo per i target che lo definiscono (le fette di Spagna).
        run: |
          if [ -n "$ZBBOX" ]; then
            echo "Ritaglio bbox: $ZBBOX"
            export LC_BBOX="$ZBBOX"
          fi
          node --max-old-space-size=6144 scripts/build_osm_passes.mjs --out "${{ steps.cfg.outputs.out }}" --no-curated

      - name: Summary
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          OUTF: ${{ steps.cfg.outputs.out }}
        run: |
          node -e '
            const fs=require("fs");
            const p="data/"+process.env.OUTF;
            if(!fs.existsSync(p)){ console.log("Nessun file prodotto: "+p); process.exit(0); }
            const a=JSON.parse(fs.readFileSync(p,"utf8"));
            const conV=a.filter(x=>x.versanti&&x.versanti.length).length;
            console.log("Passi: "+a.length+" | con almeno un versante: "+conV);
            console.log("Dimensione: "+(fs.statSync(p).size/1048576).toFixed(1)+" MB");
            console.log("Esempi: "+a.slice(0,8).map(x=>x.name+" ("+(x.elevation||"?")+" m)").join(" | "));
          '

      # UN SOLO passo, a prova di concorrenza. I file DERIVATI (osm_regions.json e
      # osm_index.json) vengono rigenerati dal contenuto di data/: due run che vedono
      # lo stesso set di file producono byte IDENTICI, quindi non possono piu' entrare
      # in conflitto. La base e' sempre origin/main pulito: niente autostash (era quello
      # a scrivere i marcatori <<<<<<< dentro i JSON quando due run si accavallavano).
      - name: Commit & push (a prova di conflitto)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          OUTF: ${{ steps.cfg.outputs.out }}
          ZBBOX: ${{ steps.cfg.outputs.bbox }}
          TGT: ${{ github.event.inputs.target }}
        run: |
          git config user.name  "locaclimb-bot"
          git config user.email "locaclimb-bot@users.noreply.github.com"
          cp "data/$OUTF" "$RUNNER_TEMP/$OUTF"     # metti al sicuro il file appena costruito
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main           # base = remoto pulito, SENZA autostash/merge
            cp "$RUNNER_TEMP/$OUTF" "data/$OUTF"    # rimetti il tuo region file sopra la base
            # meta bbox: aggiorna la sola voce di questo target
            node -e '
              const fs=require("fs"),p="data/osm_regions_meta.json";
              let m={};try{m=JSON.parse(fs.readFileSync(p,"utf8"));}catch(e){}
              const bb=(process.env.ZBBOX||"").trim();
              m[process.env.OUTF]={bbox:bb?bb.split(",").map(Number):null,target:process.env.TGT,builtAt:new Date().toISOString().slice(0,10)};
              fs.writeFileSync(p,JSON.stringify(m,null,1));
            '
            # manifesto DETERMINISTICO da disco (osm_passes.json per primo, il resto ordinato)
            node -e '
              const fs=require("fs");
              let f=fs.readdirSync("data").filter(x=>/^osm_passes.*\.json$/.test(x));
              f=f.filter(x=>x==="osm_passes.json").concat(f.filter(x=>x!=="osm_passes.json").sort());
              fs.writeFileSync("data/osm_regions.json",JSON.stringify(f)+"\n");
            '
            node scripts/build_osm_index.mjs
            # GUARDIA: non pubblicare mai marcatori di conflitto
            if grep -lE "^(<<<<<<< |=======$|>>>>>>> )" data/*.json; then
              echo "ERRORE: marcatori di conflitto nei dati, non pubblico."; exit 1
            fi
            git add "data/$OUTF" data/osm_regions.json data/osm_index.json data/osm_regions_meta.json
            if git diff --staged --quiet; then echo "Nessuna variazione da committare."; ok=1; break; fi
            git commit -m "data: OSM passes $TGT"
            if git push; then ok=1; break; fi
            echo "push preceduto da un altro run, ritento ($attempt)"; sleep $((RANDOM % 5 + 3))
          done
          [ "$ok" = 1 ] || { echo "push fallito dopo 5 tentativi"; exit 1; }
