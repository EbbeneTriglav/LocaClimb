name: OSM rotate (auto - una zona a giro)

# Automatizza osm-expand: a ogni scatto sceglie UNA zona e la fa girare, ruotando l'intera
# lista dei target (nazioni + confini + nuove), letta DIRETTAMENTE dal menu di osm-expand.yml
# cosi' resta sempre allineata. ~6 zone/giorno, distanziate 2 ore. Nessun click: parte da sola.
#
# L'indice del giro e' calcolato dal tempo (floor(epoch/7200) % N): gli scatti sono a intervalli
# fissi di 2h, quindi ogni scatto prende un indice diverso e crescente -> ruota tutte le zone.
# Niente file di stato, niente git push: cosi' evita il problema del detached-HEAD sui run cron.
#
# CODA DI PRIORITA' (02/11/2026): se data/osm_priority.json elenca zone non ancora ricostruite dopo
# la sua data "since" (scripts/osm_priority.mjs, guarda builtAt in osm_regions_meta.json), lo scatto
# prende la prima di quelle (in ordine; uno scatto su 4 a turno, per non bloccarsi su una zona
# che fallisce); quando sono tutte fatte torna al giro normale.
#
# 14/11/2026 (Rick: "non li vedo girare in automatico"): GitHub lanciava solo 2-3 dei 9 scatti al
# giorno (gli orari "in punto" sono i piu' affollati e vengono saltati), e il giro a tempo non arrivava
# mai alle zone nuove: 23 zone mai costruite. Ora: uno scatto all'ora al minuto 47, e la zona la sceglie
# scripts/osm_priority.mjs --next = coda di priorita', poi le zone MAI costruite, poi quella costruita
# da piu' tempo (builtAt). Uno scatto su 4 prende un'altra zona dello stesso gruppo: una zona che fallisce
# non blocca le altre. Se osm-expand sta ancora girando, il nuovo lancio aspetta nel gruppo osm-data.

on:
  schedule:
    - cron: "47 * * * *"   # ogni ora al minuto 47 (UTC): GitHub salta spesso gli scatti "in punto"
  workflow_dispatch: {}                # per provarlo a mano quando vuoi

permissions:
  actions: write      # basta questo: serve solo a lanciare osm-expand

concurrency:
  group: osm-rotate
  cancel-in-progress: false

jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scegli la prossima zona e lancia osm-expand
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1) lista dei target dal menu di osm-expand.yml (righe "          - nome")
          mapfile -t TARGETS < <(grep -oE '^          - [a-z][a-z0-9-]+' .github/workflows/osm-expand.yml | sed 's/^ *- //')
          N=${#TARGETS[@]}
          if [ "$N" -eq 0 ]; then echo "Nessun target trovato nel menu di osm-expand.yml"; exit 1; fi

          # 1b) un osm-expand ancora in corso o in coda: salto lo scatto (la zona scelta adesso sarebbe la
          #     stessa, non ancora finita: verrebbe costruita due volte o cancellata dalla coda osm-data)
          BUSY=$(gh run list --repo "${{ github.repository }}" --workflow osm-expand.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "${BUSY:-0}" -gt 0 ]; then echo "osm-expand gia' in corso o in coda ($BUSY): salto questo scatto"; exit 0; fi

          # 2) la zona: coda di priorita', poi mai costruite, poi la piu' vecchia (scripts/osm_priority.mjs)
          IDX=$(( $(date +%s) / 3600 ))
          T=$(TARGETS="${TARGETS[*]}" IDX=$IDX node scripts/osm_priority.mjs --next)
          if [ -z "$T" ]; then echo "Nessuna zona scelta"; exit 1; fi
          echo "Zona scelta: $T   (scatto $IDX, zone nel menu $N; in coda di priorita': $(TARGETS="${TARGETS[*]}" node scripts/osm_priority.mjs | wc -w))"

          # 3) lancia osm-expand su quella zona (dry_run ha default false)
          gh workflow run osm-expand.yml -f target="$T"
