name: OSM rotate (auto - una zona a giro)

# Automatizza osm-expand: a ogni scatto sceglie UNA zona e la fa girare, ruotando l'intera
# lista dei target (nazioni + confini + nuove), letta DIRETTAMENTE dal menu di osm-expand.yml
# cosi' resta sempre allineata. ~6 zone/giorno, distanziate 2 ore. Nessun click: parte da sola.
#
# Perche' cosi': non duplica gli step di build. Lancia osm-expand via `gh workflow run`
# (evento workflow_dispatch, che con GITHUB_TOKEN e actions:write genera davvero il run).
# Lo stato del giro sta in data/.osm_rotate (un indice), committato ad ogni scatto.

on:
  schedule:
    - cron: "0 5,7,9,11,13,15 * * *"   # 6 volte/giorno, ogni 2 ore (UTC). 05->07->...->15 UTC
  workflow_dispatch: {}                # per provarlo a mano quando vuoi

permissions:
  actions: write      # per lanciare osm-expand
  contents: write     # per salvare lo stato del giro

concurrency:
  group: osm-rotate
  cancel-in-progress: false

jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scegli la prossima zona e lancia osm-expand
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1) lista dei target dal menu di osm-expand.yml (righe "          - nome")
          mapfile -t TARGETS < <(grep -oE '^          - [a-z][a-z0-9-]+' .github/workflows/osm-expand.yml | sed 's/^ *- //')
          N=${#TARGETS[@]}
          if [ "$N" -eq 0 ]; then echo "Nessun target trovato nel menu di osm-expand.yml"; exit 1; fi

          # 2) indice corrente dallo stato (default 0)
          STATE=data/.osm_rotate
          IDX=0
          [ -f "$STATE" ] && IDX=$(cat "$STATE" 2>/dev/null || echo 0)
          case "$IDX" in ''|*[!0-9]*) IDX=0 ;; esac
          POS=$(( IDX % N ))
          T="${TARGETS[$POS]}"
          echo "Zona $(( POS + 1 ))/$N : $T   (indice $IDX)"

          # 3) lancia osm-expand su quella zona (dry_run ha default false)
          gh workflow run osm-expand.yml -f target="$T"

          # 4) avanza e salva lo stato
          echo $(( IDX + 1 )) > "$STATE"
          git config user.name  "locaclimb-bot"
          git config user.email "locaclimb-bot@users.noreply.github.com"
          git add "$STATE"
          git commit -m "rotate: prossima zona idx $(( IDX + 1 )) [skip ci]" || { echo "niente da committare"; exit 0; }
          git pull --no-rebase --no-edit || true
          git push || { git pull --no-rebase --no-edit || true; git push; }
