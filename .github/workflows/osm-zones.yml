name: osm-zones

# Costruisce le salite di una ZONA MONTUOSA fuori dall'Italia.
#
# Perche' a zone e non a nazioni: le salite stanno sulle catene montuose, non
# distribuite sul territorio. Ritagliando il riquadro della catena si lavora sul
# 5-10% dei dati di un paese, e memoria e tempi restano nei limiti del runner
# (che su questo progetto ha gia' dato problemi di OOM).
#
# Le zone sono definite in scripts/zones.json: aggiungerne una e' una modifica ai
# dati, non al workflow.
#
# Una zona per volta. Il file prodotto viene aggiunto da solo a osm_regions.json,
# che il frontend usa per sapere cosa unire.

on:
  workflow_dispatch:
    inputs:
      zone:
        description: "Id zona (vedi scripts/zones.json), es. fr-pyrenees"
        required: true
        type: string
      dry_run:
        description: "Solo verifica: scarica e ritaglia, senza costruire ne' committare"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: osm-zones
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa osmium + pngjs
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          npm i pngjs

      - name: Leggi la definizione della zona
        id: cfg
        run: |
          ZONE="${{ github.event.inputs.zone }}"
          node -e '
            const fs=require("fs");
            const z=JSON.parse(fs.readFileSync("scripts/zones.json","utf8"));
            const id=process.env.ZONE;
            if(!z[id]){
              const ids=Object.keys(z).filter(k=>!k.startsWith("_"));
              console.error("Zona sconosciuta: "+id+"\nZone disponibili:\n  "+ids.join("\n  "));
              process.exit(1);
            }
            const c=z[id];
            const GF="https://download.geofabrik.de/europe";
            const pbf=c.pbf.map(p=>GF+"/"+p+"-latest.osm.pbf").join(",");
            const out=process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out,"pbf="+pbf+"\n");
            fs.appendFileSync(out,"bbox="+(c.bbox||"")+"\n");
            fs.appendFileSync(out,"outfile="+c.out+"\n");
            fs.appendFileSync(out,"desc="+c.desc+"\n");
            console.log("Zona: "+id+"\n"+c.desc+"\nestratti: "+c.pbf.join(", ")
              +"\nritaglio: "+(c.bbox?c.bbox:"nessuno (estratto intero)")+"\nfile: "+c.out);
          '
        env:
          ZONE: ${{ github.event.inputs.zone }}

      - name: Spazio su disco disponibile
        run: df -h / | tail -1

      # LC_BBOX viene esportato SOLO se la zona ne definisce uno: senza, il build
      # elabora l'estratto regionale per intero (copertura completa, come per l'Italia).
      - name: Costruisci la zona
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          LC_PBF: ${{ steps.cfg.outputs.pbf }}
          ZBBOX: ${{ steps.cfg.outputs.bbox }}
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          if [ -n "$ZBBOX" ]; then
            echo "Ritaglio geografico attivo: $ZBBOX"
            export LC_BBOX="$ZBBOX"
          else
            echo "Nessun ritaglio: elaboro l'estratto regionale per intero."
          fi
          node scripts/build_osm_passes.mjs --out ${{ steps.cfg.outputs.outfile }}

      - name: Riepilogo del risultato
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          F="data/${{ steps.cfg.outputs.outfile }}"
          if [ -f "$F" ]; then
            node -e '
              const fs=require("fs");
              const a=JSON.parse(fs.readFileSync(process.env.F,"utf8"));
              const conV=a.filter(p=>p.versanti&&p.versanti.length).length;
              console.log("Passi trovati: "+a.length+"  |  con almeno un versante: "+conV);
              console.log("Dimensione file: "+(fs.statSync(process.env.F).size/1048576).toFixed(1)+" MB");
              console.log("Esempi: "+a.slice(0,8).map(p=>p.name+" ("+(p.elevation||"?")+" m)").join(" · "));
            '
          else
            echo "Nessun file prodotto."; exit 1
          fi
        env:
          F: data/${{ steps.cfg.outputs.outfile }}

      - name: Aggiungi il file al manifest delle regioni
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          node -e '
            const fs=require("fs");
            const p="data/osm_regions.json";
            const list=JSON.parse(fs.readFileSync(p,"utf8"));
            const f=process.env.OUTF;
            if(!list.includes(f)){ list.push(f); fs.writeFileSync(p, JSON.stringify(list)); console.log("Aggiunto al manifest: "+f); }
            else console.log("Gia' presente nel manifest: "+f);
          '
        env:
          OUTF: ${{ steps.cfg.outputs.outfile }}

      # Riquadro di competenza di ogni file: servira' a caricare solo le regioni
      # inquadrate sulla mappa invece di scaricarle tutte all'avvio.
      - name: Registra il riquadro della regione
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          node -e '
            const fs=require("fs");
            const p="data/osm_regions_meta.json";
            let m={}; try{ m=JSON.parse(fs.readFileSync(p,"utf8")); }catch(e){}
            const bb=(process.env.BBOX||"").trim();
            m[process.env.OUTF]={bbox:bb?bb.split(",").map(Number):null,zone:process.env.ZONE,builtAt:new Date().toISOString().slice(0,10)};
            fs.writeFileSync(p, JSON.stringify(m,null,1));
            console.log("Riquadro registrato per "+process.env.OUTF);
          '
        env:
          OUTF: ${{ steps.cfg.outputs.outfile }}
          BBOX: ${{ steps.cfg.outputs.bbox }}
          ZONE: ${{ github.event.inputs.zone }}

      - name: Ricostruisci l'indice dei marker
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: node scripts/build_osm_index.mjs

      - name: Commit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/${{ steps.cfg.outputs.outfile }} data/osm_regions.json data/osm_regions_meta.json data/osm_index.json
          if [ -n "$(git status --porcelain --cached)" ]; then
            git commit -m "osm-zones: ${{ github.event.inputs.zone }} [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "Nessuna variazione."
          fi
