name: OSM discover rotate (auto - sei zone a giro)

# Fa girare da sola la ricerca salite (osm-discover.yml) su TUTTE le zone del catalogo
# (11 regioni italiane + zone del mondo di scripts/lib/zones.json con discover:true).
# Due volte al giorno lancia le 6 zone mai fatte o aggiornate da piu' tempo: 12 zone/giorno,
# tutto il catalogo (~150 zone) si rinnova in circa 2 settimane. Una zona dura ~15 minuti (3 in
# parallelo): il run tiene la coda osm-data per ~30 minuti (21/11/2026: erano 2 zone a giro e
# meta' del catalogo non era mai stata cercata). Una zona fallita negli ultimi 3
# giorni va in fondo alla fila, una gia' in corso non si rilancia (21/11/2026). Orari lontani da osm-rotate
# (05-15 UTC), che scrive gli stessi file di indice.
#
# Niente file di stato e niente push: lo stato e' la storia git (data dell'ultimo commit di
# data/discover_<zona>.json, letta dalle API GitHub) - scripts/discover_next.mjs.
on:
  schedule:
    - cron: "17 1,19 * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: osm-discover-rotate
  cancel-in-progress: false

jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scegli le prossime zone e lancia osm-discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT=$(node scripts/discover_next.mjs --n 6)
          echo "Prossime zone: $NEXT"
          echo "### Prossime zone: $NEXT" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run osm-discover.yml -f zona=italia -f region="$NEXT"
