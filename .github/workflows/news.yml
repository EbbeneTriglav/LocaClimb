name: news-candidates

# Fetches news/status CANDIDATES into pass_news_candidates.json (review queue) via the
# GDELT DOC 2.0 API. NO API key, no daily limit. It does NOT touch pass_news.json
# (that stays human-curated): you approve candidates and copy the good ones in.

on:
  schedule:
    - cron: "23 4 */3 * *"   # every 3 days, 04:23 UTC
  workflow_dispatch:
    inputs:
      max:
        description: "Max passi per run (default 40)"
        required: false
        default: "40"
      span:
        description: "Finestra GDELT (es. 1w, 1m, 2m, 3m)"
        required: false
        default: "2m"
      lang:
        description: "Lingua fonti (italian / german)"
        required: false
        default: "italian"

permissions:
  contents: write

concurrency:
  group: news-candidates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch news candidates (GDELT)
        env:
          LC_NEWS_MAX: ${{ github.event.inputs.max || '40' }}
          LC_NEWS_SPAN: ${{ github.event.inputs.span || '2m' }}
          LC_NEWS_LANG: ${{ github.event.inputs.lang || 'italian' }}
        run: node scripts/fetch_news.mjs
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain pass_news_candidates.json)" ]; then
            git add pass_news_candidates.json
            git commit -m "news: aggiorna candidati GDELT [skip ci]"
            git push
          else
            echo "Nessun nuovo candidato."
          fi
