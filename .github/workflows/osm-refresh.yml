name: Refresh OSM passes

# v3: Geofabrik PBF + osmium + Terrarium DEM. No Overpass, no rate limits.
# Builds osm_passes.json + curated_overrides.json + routes_baked.json and commits.

on:
  workflow_dispatch:
    inputs:
      accept_golden_changes:
        description: "Committa anche se il golden set fallisce (cambio algoritmo VOLUTO)"
        type: boolean
        required: false
        default: false
      reenrich:
        description: "Recompute versanti for ALL passes"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 3 1 1 *"   # yearly (Jan 1, 03:17 UTC); climbs rarely change - run mostly manually

concurrency:
  group: osm-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install osmium + pngjs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          npm init -y >/dev/null && npm install pngjs@7 --no-audit --no-fund

      - name: Build data (PBF + DEM)
        run: |
          node --max-old-space-size=6144 scripts/build_osm_passes.mjs \
            --out osm_passes.json \
            ${{ (github.event.inputs.reenrich == 'true') && '--reenrich' || '' }}

      - name: Bake curated routes
        run: node scripts/bake_routes.mjs --out routes_baked.json --data passes_data.js

      - name: Gate 1 - validate data + 24 MB limit (never bypassable)
        run: |
          # manifest from disk, like the commit step does: a NEW region/border file is included
          node -e 'const fs=require("fs");let f=fs.readdirSync("data").filter(x=>/^osm_passes.*\.json$/.test(x));f=f.filter(x=>x==="osm_passes.json").concat(f.filter(x=>x!=="osm_passes.json").sort());fs.writeFileSync("data/osm_regions.json",JSON.stringify(f)+"\n");'
          node scripts/validate_data.mjs
          if [ -f test/asset-size.test.mjs ]; then node --test test/asset-size.test.mjs; fi
      - name: Gate 2 - golden set
        id: golden
        continue-on-error: ${{ github.event.inputs.accept_golden_changes == 'true' }}
        run: if [ -f test/golden.test.mjs ]; then node --test test/golden.test.mjs; fi
      - name: Golden report (visible on the run page)
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/golden_report.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build for review (gate failed)
        if: ${{ failure() || steps.golden.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: osm-build-${{ github.run_id }}
          path: |
            data/osm_passes.json
            data/curated_overrides.json
            data/routes_baked.json
          retention-days: 14

      - name: Commit changes (a prova di conflitto)
        run: |
          git config user.name  "locaclimb-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf build_tmp node_modules package.json package-lock.json
          mkdir -p "$RUNNER_TEMP/keep"
          cp data/osm_passes.json data/curated_overrides.json data/routes_baked.json "$RUNNER_TEMP/keep/" 2>/dev/null || true
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main            # base = remoto pulito, niente rebase/autostash
            cp "$RUNNER_TEMP/keep/"* data/ 2>/dev/null || true   # rimetti i file appena costruiti
            node -e '
              const fs=require("fs");
              let f=fs.readdirSync("data").filter(x=>/^osm_passes.*\.json$/.test(x));
              f=f.filter(x=>x==="osm_passes.json").concat(f.filter(x=>x!=="osm_passes.json").sort());
              fs.writeFileSync("data/osm_regions.json",JSON.stringify(f)+"\n");
            '
            node scripts/build_osm_index.mjs
            if grep -lE "^(<<<<<<< |=======$|>>>>>>> )" data/*.json; then
              echo "ERRORE: marcatori di conflitto nei dati, non pubblico."; exit 1
            fi
            git add data/
            if git diff --staged --quiet; then echo "No changes"; ok=1; break; fi
            COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/osm_passes.json')).length)")
            ENR=$(node -e "const a=JSON.parse(require('fs').readFileSync('data/osm_passes.json'));console.log(a.filter(p=>p.versanti&&p.versanti.length).length)")
            git commit -m "data: PBF+DEM build (${COUNT} passes, ${ENR} enriched)"
            if git push; then ok=1; break; fi
            echo "push preceduto da un altro run, ritento ($attempt)"; sleep $((RANDOM % 5 + 3))
          done
          [ "$ok" = 1 ] || { echo "push fallito dopo 5 tentativi"; exit 1; }
