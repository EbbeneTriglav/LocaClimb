name: OSM discover (salite senza passo)

# Trova le salite che NON hanno un nodo "passo" in OSM (cime, santuari, paesi in cima,
# strade senza uscita) come cime della rete stradale asfaltata e le PUBBLICA da sola:
#   data/discover_<regione>.json         tutte le salite trovate (l'app non lo carica)
#   data/discover_<regione>_review.json  regola + decisioni a mano (creato se manca: gruppi
#                                        "nuova" + "doppione", la regola verificata in ER)
#   data/osm_passes_disc_<regione>.json  le salite pubblicate (scripts/promote_discover.mjs)
#   data/osm_regions.json + osm_index.json  rigenerati dal disco, come fa osm-expand
# Per togliere una salita: il suo id in "no" del file _review (o "Copia esito" su
# https://locaride.app/?discover=<regione>). Non tocca curated_overrides.json ne' il golden set.
#
# Parte da solo: quando questo file cambia (push) e il 2 di ogni mese, sulle 11 regioni italiane.
# Le zone del resto d'Europa (scripts/lib/zones.json, discover:true) si lanciano a mano
# ("europa" o i loro id) finche' non arriva il giro automatico a rotazione.
# A mano si puo' lanciare una regione o "tutte". Rilanciare una regione gia' pubblicata e' sicuro:
# promote_discover.mjs riapplica le stesse scelte (data/discover_<regione>_review.json).
# 29/10/2026: rilancio di tutte, compresa "er", per il taglio del fondovalle (flatCutBase).
# 29/10/2026 (2): flatCutBase rifatto - taglia solo il fondovalle iniziale, non i falsopiani a meta salita.
# 29/10/2026 (3): pubblicazione automatica dopo la ricerca (promote + manifest + indice).
# 29/10/2026 (4): zone europee dal catalogo unico scripts/lib/zones.json.
on:
  push:
    branches: [main]
    paths: [".github/workflows/osm-discover.yml"]
  schedule:
    - cron: "17 3 2 * *"
  workflow_dispatch:
    inputs:
      region:
        description: "italia (le 11 regioni), europa (tutte le zone del catalogo), oppure uno o piu' id separati da virgola (es. er,austria)"
        required: true
        type: string
        default: italia

permissions:
  contents: write

concurrency:
  group: osm-data          # come gli altri job che scrivono in data/
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.r.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Elenco regioni
        id: r
        env:
          ONE: ${{ github.event.inputs.region }}
        run: |
          node -e '
            import("./scripts/lib/discover.mjs").then((m) => {
              const it = m.ITALY_REGIONS, all = Object.keys(m.DISCOVER_REGIONS);
              const one = (process.env.ONE || "italia").trim();
              const list = (one === "italia" || one === "tutte") ? it
                : one === "europa" ? all.filter((k) => !it.includes(k))
                : one.split(",").map((s) => s.trim()).filter(Boolean);
              const bad = list.filter((k) => !m.DISCOVER_REGIONS[k]);
              if (!list.length || bad.length) { console.error("regione sconosciuta: " + bad.join(", ") + " (note: " + all.join(", ") + ")"); process.exit(1); }
              console.log("regioni (" + list.length + "): " + list.join(", "));
              require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "regions=" + JSON.stringify(list) + "\n");
            });
          '

  discover:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false        # una regione che finisce la memoria non ferma le altre
      max-parallel: 3
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y osmium-tool
          npm install pngjs --no-save

      - name: Test della ricerca (veloce, prima dei download)
        run: node --test test/discover.test.mjs test/discover-review.test.mjs

      - name: Cerca le salite (${{ matrix.region }})
        run: node --max-old-space-size=12288 scripts/build_osm_passes.mjs --discover "${{ matrix.region }}"

      - name: Riepilogo
        env:
          REG: ${{ matrix.region }}
        run: |
          node -e '
            const fs=require("fs"),p="data/discover_"+process.env.REG+".json";
            if(!fs.existsSync(p)){ console.log("Nessun file prodotto"); process.exit(1); }
            const a=JSON.parse(fs.readFileSync(p,"utf8"));
            const g=(x)=>Math.max(0,...(x.versanti||[]).map(v=>(v.endElevation||0)-(v.startElevation||0)));
            const lines=["### "+process.env.REG+": salite nuove "+a.length,"Dimensione: "+(fs.statSync(p).size/1048576).toFixed(1)+" MB","",
              "| Nome | Quota | Dislivello max | Versanti |","|---|---|---|---|"]
              .concat(a.slice().sort((x,y)=>g(y)-g(x)).slice(0,25).map(x=>"| "+x.name+" | "+x.elevation+" m | +"+g(x)+" m | "+(x.versanti||[]).length+" |"));
            console.log(lines.join("\n"));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");
          '

      - name: Pubblica (regola del file _review, creato se manca)
        run: node scripts/promote_discover.mjs --region "${{ matrix.region }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Manifest + indice dal disco, poi controlli
        run: |
          node scripts/build_regions_manifest.mjs
          node scripts/build_osm_index.mjs
          node scripts/validate_data.mjs
          node --test test/asset-size.test.mjs

      - name: Commit & push (a prova di conflitto)
        env:
          REG: ${{ matrix.region }}
        run: |
          git config user.name  "locaclimb-bot"
          git config user.email "locaclimb-bot@users.noreply.github.com"
          DISC="discover_$REG.json"; REV="discover_${REG}_review.json"; PUB="osm_passes_disc_$REG.json"
          cp "data/$DISC" "$RUNNER_TEMP/$DISC"
          cp "data/$REV" "$RUNNER_TEMP/$REV"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main            # base = remoto pulito, niente merge/autostash
            cp "$RUNNER_TEMP/$DISC" "data/$DISC"
            cp "$RUNNER_TEMP/$REV" "data/$REV"
            # ripubblica sulla base aggiornata: un'altra regione puo' aver appena pubblicato
            # cime vicine (doppioni tra regioni); i file derivati si rigenerano dal disco
            node scripts/promote_discover.mjs --region "$REG"
            node scripts/build_regions_manifest.mjs
            node scripts/build_osm_index.mjs
            if grep -lE "^(<<<<<<< |=======$|>>>>>>> )" data/*.json; then
              echo "ERRORE: marcatori di conflitto nei dati, non pubblico."; exit 1
            fi
            git add "data/$DISC" "data/$REV" "data/$PUB" data/osm_regions.json data/osm_index.json
            if git diff --staged --quiet; then echo "Nessuna variazione."; exit 0; fi
            git commit -m "data: salite dalla rete stradale, pubblicate ($REG)"
            if git push; then exit 0; fi
            echo "push preceduto da un altro run, ritento ($attempt)"; sleep $((RANDOM % 15 + 5))
          done
          exit 1
