name: osm-border

# Cross-border corridor builds: load an Italy region + the adjacent country, clip to the
# Alpine border strip (bbox), and build so BOTH climb sides are in-graph. This recovers
# border passes (Spluga, San Bernardino, Stelvio/Umbrail, Resia, Brennero, Stalle, Monginevro,
# Maddalena, ...) that single-country builds drop because their in-country half is too short
# to pass the >=1.5km / >=200m thresholds.
#
# Output goes to osm_passes_xb_<zone>.json. Add it to osm_regions.json so the frontend merges it
# (co-located passes are de-duplicated and their versanti unioned).
#
# Run ONE zone at a time (manual dispatch). The bbox clip keeps RAM/time bounded.

on:
  workflow_dispatch:
    inputs:
      zone:
        description: "Corridoio di confine da costruire"
        required: true
        type: choice
        options:
          - ch-central   # IT/CH: Spluga, San Bernardino, Maloja, Bernina, Sempione, Stelvio/Umbrail, Gran S. Bernardo
          - at-east      # IT/AT: Resia, Brennero, Vizze, Stalle, M. Croce Comelico, Pramollo
          - fr-west      # IT/FR: Monginevro, Moncenisio, Maddalena, Agnello, Lombarde, Tenda

permissions:
  contents: write

concurrency:
  group: osm-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install osmium + pngjs
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          npm i pngjs
      - name: Map zone -> PBF + bbox + out
        id: cfg
        run: |
          GF=https://download.geofabrik.de/europe
          case "${{ github.event.inputs.zone }}" in
            ch-central)
              echo "pbf=$GF/italy/nord-ovest-latest.osm.pbf,$GF/italy/nord-est-latest.osm.pbf,$GF/switzerland-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo "bbox=7.0,45.8,10.6,46.8" >> "$GITHUB_OUTPUT"
              echo "out=osm_passes_xb_ch.json" >> "$GITHUB_OUTPUT"
              ;;
            at-east)
              echo "pbf=$GF/italy/nord-est-latest.osm.pbf,$GF/austria-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo "bbox=10.3,46.4,13.5,47.15" >> "$GITHUB_OUTPUT"
              echo "out=osm_passes_xb_at.json" >> "$GITHUB_OUTPUT"
              ;;
            fr-west)
              echo "pbf=$GF/italy/nord-ovest-latest.osm.pbf,$GF/france/rhone-alpes-latest.osm.pbf,$GF/france/provence-alpes-cote-d-azur-latest.osm.pbf" >> "$GITHUB_OUTPUT"
              echo "bbox=6.0,44.0,7.8,45.4" >> "$GITHUB_OUTPUT"
              echo "out=osm_passes_xb_fr.json" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Build border corridor
        env:
          LC_PBF: ${{ steps.cfg.outputs.pbf }}
          LC_BBOX: ${{ steps.cfg.outputs.bbox }}
        run: node scripts/build_osm_passes.mjs --out ${{ steps.cfg.outputs.out }}
      # Commit a prova di conflitto: base origin/main pulito, manifesto+index rigenerati
      # dal disco (cosi' il file xb_* viene ANCHE registrato nel manifesto, prima no),
      # guardia sui marcatori, retry sul push.
      - name: Commit & push (a prova di conflitto)
        env:
          OUTF: ${{ steps.cfg.outputs.out }}
          ZBBOX: ${{ steps.cfg.outputs.bbox }}
          ZONE: ${{ github.event.inputs.zone }}
        run: |
          git config user.name  "locaclimb-bot"
          git config user.email "locaclimb-bot@users.noreply.github.com"
          cp "data/$OUTF" "$RUNNER_TEMP/$OUTF"
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/$OUTF" "data/$OUTF"
            node -e '
              const fs=require("fs"),p="data/osm_regions_meta.json";
              let m={};try{m=JSON.parse(fs.readFileSync(p,"utf8"));}catch(e){}
              const bb=(process.env.ZBBOX||"").trim();
              m[process.env.OUTF]={bbox:bb?bb.split(",").map(Number):null,target:process.env.ZONE,builtAt:new Date().toISOString().slice(0,10)};
              fs.writeFileSync(p,JSON.stringify(m,null,1));
            '
            node -e '
              const fs=require("fs");
              let f=fs.readdirSync("data").filter(x=>/^osm_passes.*\.json$/.test(x));
              f=f.filter(x=>x==="osm_passes.json").concat(f.filter(x=>x!=="osm_passes.json").sort());
              fs.writeFileSync("data/osm_regions.json",JSON.stringify(f)+"\n");
            '
            node scripts/build_osm_index.mjs
            if grep -lE "^(<<<<<<< |=======$|>>>>>>> )" data/*.json; then
              echo "ERRORE: marcatori di conflitto nei dati, non pubblico."; exit 1
            fi
            git add data/
            if git diff --staged --quiet; then echo "Nessuna variazione."; ok=1; break; fi
            git commit -m "osm-border: build $ZONE [skip ci]"
            if git push; then ok=1; break; fi
            echo "push preceduto da un altro run, ritento ($attempt)"; sleep $((RANDOM % 5 + 3))
          done
          [ "$ok" = 1 ] || { echo "push fallito dopo 5 tentativi"; exit 1; }
