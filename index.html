/* Old links of the classic app (shared ride ?g=, ?discover=, the #admin editor) keep working:
   they open /classica/. Runs before anything else loads. */
(function () { var s = location.search, h = location.hash;

</script>
<script>

addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); LR_INSTALL.prompt = e; dispatchEvent(new Event("lr-install")); });

</script>
